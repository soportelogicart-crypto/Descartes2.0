# Publicación MANUAL de la gestión y la API de Descartes en el hosting de Descartes
# (Hostinger, gestion.topay-comunicacion.es). No se ejecuta al subir a main.
#
# IMPORTANTE: el servidor de Minimarket (topaywebapp.es, Plesk) NO es el de Descartes.
# Los secretos FTP_* antiguos apuntaban a Minimarket y ya no se usan en este flujo.
#
# Secretos del repositorio (Settings → Secrets and variables → Actions):
#   HOSTINGER_FTP_SERVER, HOSTINGER_FTP_USERNAME, HOSTINGER_FTP_PASSWORD
# Son los de la cuenta FTP de Hostinger (hPanel → Archivos → Cuentas FTP).
#
# Cómo usarlo: Actions → Publicar hosting → Run workflow.
#   - carpeta: carpeta dentro de public_html (ej. gestion/). Use / para la raíz de public_html.
#     El FTP ya entra dentro de public_html: no escriba public_html/ (crearía public_html/public_html).
#   - simulacro: marcado por defecto. Solo muestra qué subiría, sin tocar el hosting.
# No borra archivos que solo existen en el servidor (vendor, var, la base).

name: Publicar hosting

on:
  workflow_dispatch:
    inputs:
      carpeta:
        description: 'Carpeta dentro de public_html (ej. gestion/). Escriba / para la raíz de public_html'
        required: true
        type: string
      simulacro:
        description: 'Solo simular: no sube nada'
        required: true
        type: boolean
        default: true

concurrency:
  group: publicar-hosting
  cancel-in-progress: false

jobs:
  publicar:
    name: Compilar y publicar
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar destino y secretos
        id: destino
        env:
          CARPETA: ${{ inputs.carpeta }}
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "Faltan los secretos HOSTINGER_FTP_SERVER, HOSTINGER_FTP_USERNAME y HOSTINGER_FTP_PASSWORD."
            exit 1
          fi
          carpeta="$(echo "$CARPETA" | sed 's#^/*##; s#/*$##')"
            case "$carpeta" in
              *".."*)
                echo "Carpeta no permitida: '$CARPETA'."
                exit 1
                ;;
            esac
            if [ -z "$carpeta" ] || [ "$carpeta" = "." ]; then
              echo "base=./" >> "$GITHUB_OUTPUT"
              echo "Destino: raíz de public_html (FTP)"
            else
              echo "base=$carpeta/" >> "$GITHUB_OUTPUT"
              echo "Destino: $carpeta/"
            fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: descartes-gestion/package-lock.json
      - name: Compilar la gestión
        working-directory: descartes-gestion
        run: npm ci && npm run build
      # El simulacro de FTP-Deploy-Action guarda el estado en el servidor sin subir los archivos.
      # Si no se borra, la subida real cree que ya está todo sincronizado y no publica los cambios.
      - name: Olvidar el estado FTP antes de subir
        if: ${{ inputs.simulacro == false }}
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          BASE: ${{ steps.destino.outputs.base }}
        run: |
          python3 - <<'PY'
          import ftplib, os
          base = os.environ.get("BASE", "./")
          if base in ("./", "."):
              base = ""
          nombres = [
              ".ftp-deploy-sync-state.json",
              "api-descartes/src/.ftp-deploy-sync-state.json",
              "api-descartes/public/.ftp-deploy-sync-state.json",
              "api-descartes/database/.ftp-deploy-sync-state.json",
          ]
          ftp = ftplib.FTP()
          ftp.connect(os.environ["FTP_SERVER"], 21, timeout=60)
          ftp.login(os.environ["FTP_USER"], os.environ["FTP_PASS"])
          for nombre in nombres:
              ruta = base + nombre
              try:
                  ftp.delete(ruta)
                  print("borrado", ruta)
              except ftplib.all_errors as exc:
                  print("no estaba", ruta, exc)
          ftp.quit()
          PY
      - name: Subir la gestión
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: descartes-gestion/dist/
          server-dir: ${{ steps.destino.outputs.base }}
          dry-run: ${{ inputs.simulacro }}
          dangerous-clean-slate: false
          timeout: 600000
      - name: Subir src de la API
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: descartes-api/src/
          server-dir: ${{ steps.destino.outputs.base }}api-descartes/src/
          dry-run: ${{ inputs.simulacro }}
          dangerous-clean-slate: false
          timeout: 600000
      - name: Subir public de la API
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: descartes-api/public/
          server-dir: ${{ steps.destino.outputs.base }}api-descartes/public/
          dry-run: ${{ inputs.simulacro }}
          dangerous-clean-slate: false
          timeout: 600000
      - name: Subir migraciones de la API
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: descartes-api/database/
          server-dir: ${{ steps.destino.outputs.base }}api-descartes/database/
          dry-run: ${{ inputs.simulacro }}
          dangerous-clean-slate: false
          timeout: 600000
